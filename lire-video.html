<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Lecteur de vidéos</title>
<style>
:root { color-scheme: light dark; --bg: #F3F6F0; --surface: #FFFFFF; --ink: #17231A; --ink-2: #536157; --ligne: #D6DFD3; --accent: #2C673C; --accent-ink: #FFFFFF; --accent-doux: #DCEADF; --tomate: #BF3F2B; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1510; --surface: #172019; --ink: #E5ECE4; --ink-2: #9AA69C; --ligne: #2A352C; --accent: #88C898; --accent-ink: #0D1910; --accent-doux: #1E3224; --tomate: #F0806A; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, 'Segoe UI', system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.sur { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
p { margin: 0; }
.aide { color: var(--ink-2); font-size: 14px; }
.erreur { color: var(--tomate); font-weight: 600; }
.bravo { background: var(--accent-doux); color: var(--accent); font-weight: 600; padding: 12px 14px; border-radius: 12px; }
textarea { width: 100%; min-height: 40vh; padding: 12px; border: 1px solid var(--ligne); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; resize: vertical; }
button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 17px; }
.attente { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--surface); }
.point { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); animation: battre 1s ease-in-out infinite alternate; }
@keyframes battre { to { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .point { animation: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="sur">Menus à deux</p>
  <h1 id="titre">Lecteur de vidéos</h1>
  <div class="attente" id="attente"><span class="point"></span><span>Je lis la vidéo… (jusqu'à une minute)</span></div>
  <p class="erreur" id="erreur" hidden></p>
  <button id="reessayer" type="button" hidden>Réessayer</button>
  <p class="aide" id="note" hidden>Pas de paroles trouvées : seule la description est disponible.</p>
  <button id="copier" type="button" hidden>Copier le texte</button>
  <p class="bravo" id="bravo" hidden aria-live="polite">Copié. Retourne dans l'appli et colle le texte à l'étape 2.</p>
  <label for="texte" class="aide" id="etiquette" hidden>Le texte de la vidéo</label>
  <textarea id="texte" readonly hidden></textarea>
</main>
<script>
(function () {
  'use strict';
  var FONCTION = 'https://mxnrqnpvcxwdwykzzchk.supabase.co/functions/v1/lire-video';
  var $ = function (id) { return document.getElementById(id); };
  var infos = new URLSearchParams(location.hash.slice(1));
  var lien = infos.get('v');
  var jeton = infos.get('j');
  // Le jeton ne reste ni dans la barre d'adresse ni dans l'historique
  history.replaceState(null, '', location.pathname);

  function montrer(id, oui) { $(id).hidden = !oui; }

  function echec(message, reessayable) {
    montrer('attente', false);
    $('erreur').textContent = message;
    montrer('erreur', true);
    montrer('reessayer', !!reessayable);
  }

  function lire() {
    if (!lien || !jeton) { echec('Lien incomplet : rouvre le lecteur depuis l\'appli.', false); return; }
    montrer('erreur', false);
    montrer('reessayer', false);
    montrer('attente', true);
    var ctl = new AbortController();
    var minuteur = setTimeout(function () { ctl.abort(); }, 145000);
    fetch(FONCTION, {
      method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lien: lien, jeton: jeton }),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (x) {
      clearTimeout(minuteur);
      if (!x.ok || !x.d.texte) { echec(x.d.erreur || 'Le lecteur ne répond pas. Réessaie dans un moment.', true); return; }
      montrer('attente', false);
      $('titre').textContent = x.d.titre || 'Vidéo';
      $('texte').value = x.d.texte;
      montrer('note', !!x.d.sansParoles);
      montrer('copier', true);
      montrer('etiquette', true);
      montrer('texte', true);
    }).catch(function () {
      clearTimeout(minuteur);
      echec('La lecture n\'a pas abouti. Vérifie ta connexion et réessaie.', true);
    });
  }

  function copie() {
    var t = $('texte');
    t.focus();
    t.select();
    t.setSelectionRange(0, t.value.length);
    var fini = function () { montrer('bravo', true); $('copier').textContent = 'Copié'; };
    var repli = function () {
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) fini();
      else { $('bravo').textContent = 'Sélectionne le texte ci-dessous et copie-le à la main.'; montrer('bravo', true); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(fini, repli);
    else repli();
  }

  $('copier').addEventListener('click', copie);
  $('reessayer').addEventListener('click', lire);
  lire();
})();
</script>
</body>
</html>
